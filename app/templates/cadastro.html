  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cadastro</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='login.css') }}"
  >

</head>

<body>

  <main class="login-box">

    <h1>Criar Conta</h1>

    {% with messages = get_flashed_messages() %}

      {% if messages %}

        <div
          class="erro"
          role="alert"
        >
          {{ messages[0] }}
        </div>

      {% endif %}

    {% endwith %}

    <form
      method="POST"
      action="{{ url_for('paginas.cadastro') }}"
    >

      <label
        class="campo-oculto"
        for="nome"
      >
        Nome
      </label>

      <input
        type="text"
        name="nome"
        id="nome"
        placeholder="Digite seu nome"
        autocomplete="name"
        required
      >

      <label
        class="campo-oculto"
        for="email"
      >
        E-mail
      </label>

      <input
        type="email"
        name="email"
        id="email"
        placeholder="Digite seu email"
        autocomplete="email"
        required
      >

      <div class="senha-box">

        <label
          class="campo-oculto"
          for="senha"
        >
          Senha
        </label>

        <input
          type="password"
          name="senha"
          id="senha"
          placeholder="Digite sua senha"
          autocomplete="new-password"
          required
          oninput="validarSenha()"
        >

        <button
          type="button"
          class="botao-senha"
          onclick="mostrarSenha('senha')"
          aria-label="Mostrar ou ocultar senha"
        >
          👁
        </button>

      </div>

      <div class="senha-box">

        <label
          class="campo-oculto"
          for="confirmar_senha"
        >
          Confirmar senha
        </label>

        <input
          type="password"
          name="confirmar_senha"
          id="confirmar_senha"
          placeholder="Confirme sua senha"
          autocomplete="new-password"
          required
          oninput="validarSenha()"
        >

        <button
          type="button"
          class="botao-senha"
          onclick="mostrarSenha('confirmar_senha')"
          aria-label="Mostrar ou ocultar confirmação da senha"
        >
          👁
        </button>

      </div>

      <label
        class="campo-oculto"
        for="tipo"
      >
        Tipo de usuário
      </label>

      <select
        name="tipo"
        id="tipo"
        required
      >

        <option value="">
          Selecione o tipo de usuário
        </option>

        <option value="aluno">
          Aluno
        </option>

        <option value="professor">
          Professor
        </option>

      </select>

      <button
        type="submit"
        id="btnCadastro"
      >
        Criar Conta
      </button>

    </form>

    <div class="links">

      <p>

        Já possui conta?

        <a href="{{ url_for('paginas.login') }}">
          Entrar
        </a>

      </p>

    </div>

  </main>

  <script>

    function validarSenha() {

      const senha =
        document.getElementById("senha").value;

      const confirmar =
        document.getElementById("confirmar_senha");

      const botao =
        document.getElementById("btnCadastro");

      if (senha !== confirmar.value) {

        confirmar.classList.add("senha-invalida");

        confirmar.classList.remove(
          "senha-valida"
        );

        botao.disabled = true;

      } else {

        confirmar.classList.remove(
          "senha-invalida"
        );

        confirmar.classList.add(
          "senha-valida"
        );

        botao.disabled = false;

      }

    }

    function mostrarSenha(id) {

      const campo =
        document.getElementById(id);

      campo.type =
        campo.type === "password"
          ? "text"
          : "password";

    }

  </script>

</body>
</html>
