<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Cadastro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

<div class="login-box">

    <h1>Criar Conta</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="erro">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('paginas.cadastro') }}">

        <input
            type="text"
            name="nome"
            placeholder="Digite seu nome"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Digite seu email"
            required
        >

        <div class="senha-box">

    <input
        type="password"
        name="senha"
        id="senha"
        placeholder="Digite sua senha"
        required
        oninput="validarSenha()"
    >

    <span onclick="mostrarSenha('senha')">👁</span>

</div>

<div class="senha-box">

    <input
        type="password"
        name="confirmar_senha"
        id="confirmar_senha"
        placeholder="Confirme sua senha"
        required
        oninput="validarSenha()"
    >

    <span onclick="mostrarSenha('confirmar_senha')">👁</span>

</div>

        <select name="tipo" required>

            <option value="">
                Selecione o tipo de usuário
            </option>

            <option value="aluno">
                Aluno
            </option>

            <option value="professor">
                Professor
            </option>

        </select>

        <button type="submit" id="btnCadastro">
            Criar Conta
        </button>

    </form>

    <div class="links">

        <p>
            Já possui conta?
            <a href="{{ url_for('paginas.login') }}">
                Entrar
            </a>
        </p>

    </div>

</div>
<script>
function validarSenha() {
    const senha = document.getElementById("senha").value
    const confirmar = document.getElementById("confirmar_senha")
    const botao = document.querySelector("button[type='submit']")

    if (senha !== confirmar.value) {
        confirmar.style.border = "2px solid red"
        botao.disabled = true
    } else {
        confirmar.style.border = "2px solid green"
        botao.disabled = false
    }
}
</script>

<script>

function mostrarSenha(id) {

    const campo = document.getElementById(id)

    if (campo.type === "password") {
        campo.type = "text"
    } else {
        campo.type = "password"
    }
}

</script>

</body>

</html>
