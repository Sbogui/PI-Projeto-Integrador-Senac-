<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Área do Aluno</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='aluno.css') }}"
  >

</head>

<body>

  <header>

    <h1>Área do Aluno</h1>

    <div class="usuario_area">

      <p class="p1">
        Bem-vindo, {{ session['usuario'] }}
      </p>

      <a href="{{ url_for('paginas.logout') }}">
        Sair
      </a>

    </div>

  </header>

  <main class="container">

    <h2>
      Painel do Aluno
    </h2>

    <section
      class="cards"
      aria-label="Resumo do aluno"
    >

      <article class="card">

        <h2>Notas</h2>

        <p>
          Visualizar notas
        </p>

      </article>

      <article class="card">

        <h2>Frequência</h2>

        <p>
          Visualizar presença
        </p>

      </article>

      <article class="card">

        <h2>Matrícula</h2>

        <p>
          Dados da matrícula
        </p>

      </article>

    </section>

  </main>

</body>
</html>
