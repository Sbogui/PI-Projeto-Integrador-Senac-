  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='login.css') }}"
  >

</head>

<body>

  <main class="login-box">

    <h1>Projeto Integrador</h1>

    {% with messages = get_flashed_messages() %}

      {% if messages %}

        <div
          class="erro"
          role="alert"
        >
          {{ messages[0] }}
        </div>

      {% endif %}

    {% endwith %}

    <form method="POST">

      <label
        class="campo-oculto"
        for="email"
      >
        E-mail
      </label>

      <input
        type="email"
        name="email"
        id="email"
        placeholder="Digite seu email"
        autocomplete="email"
        required
      >

      <div class="senha-box">

        <label
          class="campo-oculto"
          for="senha"
        >
          Senha
        </label>

        <input
          type="password"
          name="senha"
          id="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="botao-senha"
          onclick="mostrarSenha()"
          aria-label="Mostrar ou ocultar senha"
          aria-controls="senha"
        >
          👁
        </button>

      </div>

      <button type="submit">
        Entrar
      </button>

    </form>

    <div class="links">

      <p>

        <a href="{{ url_for('paginas.recuperar_senha') }}">
          Esqueci minha senha
        </a>

      </p>

      <p>

        Não possui conta?

        <a href="{{ url_for('paginas.cadastro') }}">
          Criar conta
        </a>

      </p>

    </div>

  </main>

  <script>

    function mostrarSenha() {

      const campo =
        document.getElementById("senha");

      campo.type =
        campo.type === "password"
          ? "text"
          : "password";

    }

  </script>

</body>
</html>
